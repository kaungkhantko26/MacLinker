[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "maclinker"
version = "0.1.0"
description = "Share keyboard, mouse, clipboard and files between Linux and Macs running MacLinker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaung Khant Ko" }]
dependencies = [
    "cryptography>=41",
    "zeroconf>=0.130",
    "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
x11 = ["python-xlib>=0.33; sys_platform == 'linux'"]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
maclinker = "maclinker.__main__:main"

[tool.setuptools.packages.find]
include = ["maclinker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
