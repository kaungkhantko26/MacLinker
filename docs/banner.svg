<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#e8ecff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <!-- two screens joined by a pointer path -->
  <g transform="translate(110 70)">
    <rect x="0" y="0" width="250" height="160" rx="14" fill="url(#glass)"/>
    <rect x="12" y="12" width="226" height="124" rx="8" fill="#5b8cff"/>
    <rect x="-24" y="168" width="298" height="12" rx="6" fill="#ffffff" fill-opacity="0.85"/>
  </g>
  <g transform="translate(910 80)">
    <rect x="0" y="0" width="260" height="150" rx="12" fill="url(#glass)"/>
    <rect x="12" y="12" width="236" height="114" rx="6" fill="#a78bfa"/>
    <rect x="70" y="160" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
  </g>
  <path d="M330 170 C 470 80, 560 260, 700 150 S 860 120, 930 150" fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="2 16" opacity="0.9"/>
  <path d="M600 128 l0 44 l12 -11 l9 21 l9 -4 l-9 -21 l16 0 z" fill="#ffffff" stroke="#3b3b6b" stroke-width="2" stroke-linejoin="round"/>
  <text x="640" y="268" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff">MacLinker</text>
  <text x="640" y="302" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="22" fill="#ffffff" fill-opacity="0.92">One keyboard and mouse across your Macs. No Continuity required.</text>
</svg>
